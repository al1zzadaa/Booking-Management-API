databaseChangeLog:
  - changeSet:
      id: add-unique-payment-reference
      author: sadig
      changes:
        - sql:
            sql: |
              CREATE UNIQUE INDEX uk_payment_reference
              ON transactions (reference_id, reference_type)
              WHERE type = 'PAYMENT';

      rollback:
        - sql:
            sql: |
              DROP INDEX IF EXISTS uk_payment_reference;