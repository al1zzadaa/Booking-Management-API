databaseChangeLog:
  - changeSet:
      id: add-price-to-seats
      author: sadigalizada
      changes:
        - addColumn:
            tableName: seats
            columns:
              - column:
                  name: price
                  type: DECIMAL(19,2)

      rollback:
        - dropColumn:
            tableName: seats
            columnName: price


  - changeSet:
      id: set-default-seat-price
      author: sadigalizada
      changes:
        - update:
            tableName: seats
            columns:
              - column:
                  name: price
                  valueNumeric: 100.00

      rollback:
        - update:
            tableName: seats
            columns:
              - column:
                  name: price
                  valueNumeric: null


  - changeSet:
      id: make-seat-price-not-null
      author: sadigalizada
      changes:
        - addNotNullConstraint:
            tableName: seats
            columnName: price
            columnDataType: DECIMAL(19,2)

      rollback:
        - dropNotNullConstraint:
            tableName: seats
            columnName: price
            columnDataType: DECIMAL(19,2)


  - changeSet:
      id: remove-flight-price
      author: sadigalizada
      changes:
        - dropColumn:
            tableName: flights
            columnName: price

      rollback:
        - addColumn:
            tableName: flights
            columns:
              - column:
                  name: price
                  type: DECIMAL(19,2)