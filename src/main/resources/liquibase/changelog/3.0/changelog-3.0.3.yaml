databaseChangeLog:
  - changeSet:
      id: create-flight-bookings-table
      author: sadigalizada
      changes:

        - createTable:
            tableName: flight_bookings
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: account_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: flight_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: total_price
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: flight_bookings
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_flight_booking_user

        - addForeignKeyConstraint:
            baseTableName: flight_bookings
            baseColumnNames: account_id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_flight_booking_account

        - addForeignKeyConstraint:
            baseTableName: flight_bookings
            baseColumnNames: flight_id
            referencedTableName: flights
            referencedColumnNames: id
            constraintName: fk_flight_booking_flight

      rollback:
        - dropForeignKeyConstraint:
            baseTableName: flight_bookings
            constraintName: fk_flight_booking_user

        - dropForeignKeyConstraint:
            baseTableName: flight_bookings
            constraintName: fk_flight_booking_account

        - dropForeignKeyConstraint:
            baseTableName: flight_bookings
            constraintName: fk_flight_booking_flight

        - dropTable:
            tableName: flight_bookings


  - changeSet:
      id: add-flight-booking-to-tickets
      author: sadigalizada
      changes:

        - addColumn:
            tableName: tickets
            columns:
              - column:
                  name: flight_booking_id
                  type: BIGINT

        - addForeignKeyConstraint:
            baseTableName: tickets
            baseColumnNames: flight_booking_id
            referencedTableName: flight_bookings
            referencedColumnNames: id
            constraintName: fk_ticket_flight_booking

      rollback:
        - dropForeignKeyConstraint:
            baseTableName: tickets
            constraintName: fk_ticket_flight_booking

        - dropColumn:
            tableName: tickets
            columnName: flight_booking_id