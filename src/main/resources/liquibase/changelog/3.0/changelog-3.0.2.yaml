databaseChangeLog:
  - changeSet:
      id: add-auto-renew-account-to-subscriptions
      author: sadigalizada
      changes:
        - addColumn:
            tableName: subscriptions
            columns:
              - column:
                  name: auto_renew_account_id
                  type: BIGINT
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableName: subscriptions
            baseColumnNames: auto_renew_account_id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_subscription_auto_renew_account

      rollback:
        - dropForeignKeyConstraint:
            baseTableName: subscriptions
            constraintName: fk_subscription_auto_renew_account

        - dropColumn:
            tableName: subscriptions
            columnName: auto_renew_account_id