databaseChangeLog:
  # ChangeSet for FavoriteFlightEntity
  - changeSet:
      id: create-favorite-flights
      author: sadigalizada
      changes:
        - createTable:
            tableName: favorite_flights
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_favorite_flights
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_favorite_flights_user
                    references: users(id)
              - column:
                  name: flight_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_favorite_flights_flight
                    references: flights(id)
              - column:
                  name: created_at
                  type: DATE
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: favorite_flights

  # ChangeSet for FavoriteHotelEntity
  - changeSet:
      id: create-favorite-hotels
      author: sadigalizada
      changes:
        - createTable:
            tableName: favorite_hotels
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_favorite_hotels
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_favorite_hotels_user
                    references: users(id)
              - column:
                  name: hotel_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_favorite_hotels_hotel
                    references: hotels(id)
              - column:
                  name: created_at
                  type: DATE
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: favorite_hotels