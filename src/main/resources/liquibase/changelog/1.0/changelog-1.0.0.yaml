databaseChangeLog:
  - changeSet:
      id: create-users
      author: sadigalizada
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: first_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: last_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: phone_number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: date_of_birth
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: is_active
                  type: VARCHAR(50)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false

              - column:
                  name: email_verified_at
                  type: TIMESTAMP

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP


      rollback:
        - dropTable:
            tableName: users

  - changeSet:
      id: create-accounts
      author: sadigalizada
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: balance
                  type: DECIMAL(19,2)

              - column:
                  name: currency
                  type: VARCHAR(20)

              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: ACTIVE

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP

        - addForeignKeyConstraint:
            baseTableName: accounts
            baseColumnNames: user_id
            constraintName: fk_accounts_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE


      rollback:
        - dropTable:
            tableName: accounts

  - changeSet:
      id: create-user-roles
      author: sadigalizada
      changes:
        - createTable:
            tableName: user_entity_roles
            columns:
              - column:
                  name: user_entity_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: roles
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: user_entity_roles
            columnNames: user_entity_id, roles
            constraintName: pk_user_roles

        - addForeignKeyConstraint:
            baseTableName: user_entity_roles
            baseColumnNames: user_entity_id
            constraintName: fk_user_roles_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE


      rollback:
        - dropTable:
            tableName: user_roles