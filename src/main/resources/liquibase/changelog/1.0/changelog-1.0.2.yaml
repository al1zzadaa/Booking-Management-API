databaseChangeLog:
  # ChangeSet for FlightEntity
  - changeSet:
      id: create-flights
      author: sadigalizada
      changes:
        - createTable:
            tableName: flights
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_flights
              - column:
                  name: departure_country
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: departure_city
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: arrival_country
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: arrival_city
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: departure_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: arrival_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: airline_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_flights_airline
                    references: airlines(id)
              - column:
                  name: price
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: flight_number
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
      rollback:
        - dropTable:
            tableName: flights

  # ChangeSet for SeatEntity
  - changeSet:
      id: create-seats
      author: sadigalizada
      changes:
        - createTable:
            tableName: seats
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_seats
              - column:
                  name: flight_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_seats_flight
                    references: flights(id)
              - column:
                  name: seat
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: seat_row
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: seat_number
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: ticket_class
                  type: VARCHAR(255)
              - column:
                  name: is_available
                  type: BOOLEAN
                  defaultValueBoolean: true
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
      rollback:
        - dropTable:
            tableName: seats