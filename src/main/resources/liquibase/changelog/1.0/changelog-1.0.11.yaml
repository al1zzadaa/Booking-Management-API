databaseChangeLog:
  # ChangeSet for SubscriptionPlanEntity
  - changeSet:
      id: create-subscription-plans
      author: sadigalizada
      changes:
        - createTable:
            tableName: subscription_plans
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_subscription_plans
              - column:
                  name: subscription_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: duration_days
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: subscription_plans

  # ChangeSet for SubscriptionEntity
  - changeSet:
      id: create-subscriptions
      author: sadigalizada
      changes:
        - createTable:
            tableName: subscriptions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_subscriptions
              - column:
                  name: account_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_subscriptions_account
                    references: accounts(id)
              - column:
                  name: plan_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_subscriptions_plan
                    references: subscription_plans(id)
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: auto_renew
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: subscriptions