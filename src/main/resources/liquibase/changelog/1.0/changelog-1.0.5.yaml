databaseChangeLog:
  - changeSet:
      id: create-bookings
      author: sadigalizada
      changes:
        - createTable:
            tableName: bookings
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_bookings
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_bookings_user
                    references: users(id)
              - column:
                  name: hotel_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_bookings_hotel
                    references: hotels(id)
              - column:
                  name: room_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_bookings_room
                    references: rooms(id)
              - column:
                  name: check_in
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: check_out
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: total_price
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: booking_status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
      rollback:
        - dropTable:
            tableName: bookings

  - changeSet:
      id: create-tickets
      author: sadigalizada
      changes:
        - createTable:
            tableName: tickets
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_tickets
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_tickets_user
                    references: users(id)
              - column:
                  name: account_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_tickets_account
                    references: accounts(id)
              - column:
                  name: flight_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_tickets_flight
                    references: flights(id)
              - column:
                  name: seat_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_tickets_seat
                    references: seats(id)
              - column:
                  name: fare_baggage_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_tickets_fare_baggage
                    references: fare_baggage(id)
              - column:
                  name: price
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
      rollback:
        - dropTable:
            tableName: tickets