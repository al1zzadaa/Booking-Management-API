databaseChangeLog:
  - changeSet:
      id: create-email-verification-tokens
      author: sadigalizada

      changes:
        - createTable:
            tableName: email_verification_tokens
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_email_verification_tokens
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: token
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: email_verification_tokens
            baseColumnNames: user_id
            constraintName: fk_email_verification_tokens_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE

      rollback:
        - dropForeignKeyConstraint:
            baseTableName: email_verification_tokens
            constraintName: fk_email_verification_tokens_user

        - dropTable:
            tableName: email_verification_tokens